<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Fun 🐾 FULL PACK</title>
<style>
  body { margin: 0; overflow: hidden; background: skyblue; }
  h1 { position: absolute; top: 10px; left: 20px; color: white; }
</style>
</head>
<body>

<h1>🐾 Animal Fun (FULL 34 Animals)</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>

<script>
// BASIC SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,6,12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10,20,10);
scene.add(light);

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshLambertMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// LOADER
const loader = new THREE.GLTFLoader();

// REAL MODELS (base animals)
const baseModels = [
  {name:"Flamingo", url:"https://threejs.org/examples/models/gltf/Flamingo.glb", scale:0.02},
  {name:"Parrot", url:"https://threejs.org/examples/models/gltf/Parrot.glb", scale:0.02},
  {name:"Stork", url:"https://threejs.org/examples/models/gltf/Stork.glb", scale:0.02}
];

// 34 "species names"
const species = [
"lion","tiger","elephant","giraffe","zebra","dog","cat","wolf",
"fox","bear","panda","cow","horse","sheep","goat","deer",
"kangaroo","monkey","gorilla","hippo","rhino","pig","boar","cheetah",
"leopard","camel","buffalo","moose","otter","raccoon","squirrel","penguin",
"seal","eagle"
];

const animals = [];
let player = null;

// LOAD AND CLONE
function loadBaseModel(base, callback) {
  loader.load(base.url, (gltf) => {
    callback(gltf.scene, base.scale);
  });
}

// CREATE ALL ANIMALS
baseModels.forEach((base) => {
  loadBaseModel(base, (model, scale) => {

    for (let i = 0; i < 12; i++) {
      if (animals.length >= 34) return;

      const clone = model.clone(true);

      // random color tint (makes them look different)
      clone.traverse((child) => {
        if (child.isMesh) {
          child.material = child.material.clone();
          child.material.color.set(Math.random() * 0xffffff);
        }
      });

      clone.scale.set(scale, scale, scale);

      clone.position.set(
        (Math.random() - 0.5) * 80,
        0,
        (Math.random() - 0.5) * 80
      );

      scene.add(clone);
      animals.push(clone);

      if (!player) player = clone;
    }
  });
});

// CONTROLS
document.addEventListener("keydown", (e) => {
  if (!player) return;

  const speed = 0.6;

  if (e.key === "w") player.position.z -= speed;
  if (e.key === "s") player.position.z += speed;
  if (e.key === "a") player.position.x -= speed;
  if (e.key === "d") player.position.x += speed;
});

// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  animals.forEach(a => {
    a.rotation.y += 0.005;
    a.position.x += (Math.random() - 0.5) * 0.05;
    a.position.z += (Math.random() - 0.5) * 0.05;
  });

  if (player) {
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 12;
    camera.lookAt(player.position);
  }

  renderer.render(scene, camera);
}
animate();

// RESIZE
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
