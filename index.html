<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Fun 🐾</title>
<style>
  body { margin: 0; overflow: hidden; background: skyblue; font-family: Arial; }
  h1 { position: absolute; top: 10px; left: 20px; color: white; z-index: 10; }
</style>
</head>
<body>

<h1>🐾 Animal Fun</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// CAMERA
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,5,10);

// RENDERER
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,7);
scene.add(light);

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  new THREE.MeshLambertMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// 🐾 FUNCTION TO CREATE ANIMAL (simple "dog-like")
function createAnimal(x, z, color) {
  const group = new THREE.Group();

  // body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.7, 0.7),
    new THREE.MeshLambertMaterial({ color })
  );
  group.add(body);

  // head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshLambertMaterial({ color })
  );
  head.position.set(1, 0.2, 0);
  group.add(head);

  // legs
  for (let i = 0; i < 4; i++) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.5, 0.2),
      new THREE.MeshLambertMaterial({ color: 0x333333 })
    );
    leg.position.set(i < 2 ? -0.5 : 0.5, -0.6, i % 2 === 0 ? -0.3 : 0.3);
    group.add(leg);
  }

  // tail
  const tail = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 0.8),
    new THREE.MeshLambertMaterial({ color })
  );
  tail.position.set(-1, 0.2, 0);
  group.add(tail);

  group.position.set(x, 0.8, z);
  scene.add(group);

  return group;
}

// 🧍 PLAYER (animal too!)
const player = createAnimal(0, 0, 0xffffff);

// 🐶 MANY ANIMALS
const animals = [
  createAnimal(3,3,0xffaa00),
  createAnimal(-3,2,0x8888ff),
  createAnimal(2,-3,0xff66aa),
  createAnimal(-2,-2,0x66ff66)
];

// CONTROLS
document.addEventListener("keydown", (e) => {
  const speed = 0.4;

  if (e.key === "w") player.position.z -= speed;
  if (e.key === "s") player.position.z += speed;
  if (e.key === "a") player.position.x -= speed;
  if (e.key === "d") player.position.x += speed;
});

// ANIMATE
function animate() {
  requestAnimationFrame(animate);

  animals.forEach(animal => {
    // random movement
    animal.position.x += (Math.random() - 0.5) * 0.05;
    animal.position.z += (Math.random() - 0.5) * 0.05;

    // face direction
    animal.rotation.y += 0.02;
  });

  // camera follow
  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 10;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}
animate();

// RESIZE
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
