<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Fun 🐾</title>
<style>
  body { margin: 0; overflow: hidden; background: skyblue; }
  h1 { position: absolute; top: 10px; left: 20px; color: white; }
</style>
</head>
<body>

<h1>🐾 Animal Fun (34 Animals!)</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// CAMERA
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 12);

// RENDERER
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80,80),
  new THREE.MeshLambertMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// 🐾 ANIMAL BUILDER (more detailed)
function createAnimal(type, x, z) {
  const group = new THREE.Group();

  const bodyColor = Math.random() * 0xffffff;

  // body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.7, 0.7),
    new THREE.MeshLambertMaterial({ color: bodyColor })
  );
  group.add(body);

  // head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshLambertMaterial({ color: bodyColor })
  );
  head.position.set(1, 0.2, 0);
  group.add(head);

  // ears (different per animal)
  if (type.includes("rabbit") || type.includes("cat")) {
    for (let i = 0; i < 2; i++) {
      const ear = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.5, 0.2),
        new THREE.MeshLambertMaterial({ color: bodyColor })
      );
      ear.position.set(1, 0.7, i === 0 ? -0.2 : 0.2);
      group.add(ear);
    }
  }

  // neck (giraffe style)
  if (type.includes("giraffe")) {
    const neck = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 1.2, 0.3),
      new THREE.MeshLambertMaterial({ color: bodyColor })
    );
    neck.position.set(0.8, 0.8, 0);
    group.add(neck);
  }

  // tail
  const tail = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 0.8),
    new THREE.MeshLambertMaterial({ color: bodyColor })
  );
  tail.position.set(-1, 0.2, 0);
  group.add(tail);

  // legs
  for (let i = 0; i < 4; i++) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.5, 0.2),
      new THREE.MeshLambertMaterial({ color: 0x333333 })
    );
    leg.position.set(i < 2 ? -0.5 : 0.5, -0.6, i % 2 === 0 ? -0.3 : 0.3);
    group.add(leg);
  }

  group.position.set(x, 0.8, z);
  scene.add(group);

  return group;
}

// 🐾 34 ANIMAL TYPES
const animalTypes = [
"dog","cat","lion","tiger","elephant","giraffe","zebra","rabbit",
"fox","wolf","bear","panda","cow","horse","sheep","goat",
"deer","kangaroo","monkey","gorilla","hippo","rhino","pig","boar",
"cheetah","leopard","camel","buffalo","moose","otter","raccoon","squirrel",
"penguin","seal"
];

// CREATE ANIMALS
const animals = [];

animalTypes.forEach((type, i) => {
  const x = (Math.random() - 0.5) * 40;
  const z = (Math.random() - 0.5) * 40;
  animals.push(createAnimal(type, x, z));
});

// PLAYER
const player = animals[0];

// CONTROLS
document.addEventListener("keydown", (e) => {
  const speed = 0.5;

  if (e.key === "w") player.position.z -= speed;
  if (e.key === "s") player.position.z += speed;
  if (e.key === "a") player.position.x -= speed;
  if (e.key === "d") player.position.x += speed;
});

// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  animals.forEach(animal => {
    animal.position.x += (Math.random() - 0.5) * 0.03;
    animal.position.z += (Math.random() - 0.5) * 0.03;
    animal.rotation.y += 0.01;
  });

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 12;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}
animate();

// RESIZE
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
