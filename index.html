<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Fun 🐾</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    background: skyblue;
  }

  h1 {
    position: absolute;
    top: 10px;
    left: 20px;
    color: white;
    z-index: 10;
  }
</style>
</head>
<body>

<h1>🐾 Animal Fun</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 5, 10);

// RENDERER
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 7);
scene.add(light);

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshLambertMaterial({ color: 0x228B22 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// PLAYER (white cube)
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshLambertMaterial({ color: 0xffffff })
);
player.position.y = 0.5;
scene.add(player);

// CREATE ANIMALS
function createAnimal(color, x, z) {
  const animal = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshLambertMaterial({ color })
  );
  animal.position.set(x, 0.5, z);
  scene.add(animal);

  return animal;
}

// MANY ANIMALS (you can expand later to 34+)
const animals = [
  createAnimal(0xff0000, 3, 3),
  createAnimal(0x0000ff, -3, 2),
  createAnimal(0xffff00, 2, -3),
  createAnimal(0xff00ff, -2, -2),
  createAnimal(0x00ffff, 4, -4)
];

// CONTROLS
document.addEventListener("keydown", (e) => {
  const speed = 0.5;

  if (e.key === "w") player.position.z -= speed;
  if (e.key === "s") player.position.z += speed;
  if (e.key === "a") player.position.x -= speed;
  if (e.key === "d") player.position.x += speed;
});

// ANIMATE
function animate() {
  requestAnimationFrame(animate);

  // Animal movement (simple AI)
  animals.forEach(animal => {
    animal.position.x += (Math.random() - 0.5) * 0.05;
    animal.position.z += (Math.random() - 0.5) * 0.05;
    animal.rotation.y += 0.01;
  });

  // Camera follows player
  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 10;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
